rangetech-support-levels=Custom preset only. Number of range researches for Support turrets (medic turrets that heal instead of damage). 0 disables the category.
rangetech-support-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-support-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-other-levels=Custom preset only. Number of range researches for Other turrets (modded turrets that fit no other category). 0 disables the category.
rangetech-other-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-other-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-sweep-interval=Seconds between batches of the sweep that upgrades turrets placed by scripts without a build event. 0 turns off the sweep. Turrets built normally or by bots are upgraded instantly.
rangetech-sweep-chunks-per-event=Maximum map chunks checked at each sweep event. Lower values spread the work over more events and take longer to cover the map.

