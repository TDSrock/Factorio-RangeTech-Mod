[string-mod-setting-description]
rangetech-preset-percent=Adds 10% of each turret's original range per level.\n5 levels give +50% range in total.\nResearch starts at 100 science units and costs 1.5x more per level. Each unit takes 30 seconds.\nApplies to every supported category.
rangetech-preset-flat=Adds 3 tiles of range per level.\n5 levels give +15 tiles in total.\nResearch starts at 100 science units and costs 1.5x more per level. Each unit takes 30 seconds.\nApplies to every supported category.
rangetech-preset-conservative=Adds 5% of each turret's original range per level.\n5 levels give +25% range in total.\nResearch starts at 100 science units and costs 1.5x more per level. Each unit takes 30 seconds.\nApplies to every supported category.
rangetech-preset-long-range=Adds 20% of each turret's original range per level.\n5 levels give +100% range in total, doubling the original range.\nResearch starts at 100 science units and costs 1.5x more per level. Each unit takes 30 seconds.\nApplies to every supported category.
rangetech-preset-gradual=Adds 5% of each turret's original range per level.\n10 levels give +50% range in total.\nResearch starts at 100 science units and costs 1.5x more per level through level 10. Each unit takes 30 seconds.\nReaching the full bonus costs more science than the Percent preset. Applies to every supported category.
rangetech-preset-expensive=Adds 10% of each turret's original range per level.\n5 levels give +50% range in total.\nResearch costs 500, 1,000, 2,000, 4,000, then 8,000 science units. Each unit takes 30 seconds.\nApplies to every supported category.
rangetech-preset-custom=Uses the individual Custom settings below.\nChoose the number of levels, percentage or flat tile bonus, and bonus per level for each category. Set a category to 0 levels to disable its range research.\nChoose the starting research cost, cost growth per level, and seconds per unit.\nThese settings apply when Custom is selected.

