[mod-setting-description]
rangetech-preset=Each preset applies to every supported category.\nPercent: +10% of base range per level, 5 levels (+50% total).\nFlat tiles: +3 tiles per level, 5 levels (+15 tiles total).\nConservative: +5% per level, 5 levels (+25% total).\nLong range: +20% per level, 5 levels (+100% total).\nGradual: +5% per level, 10 levels (+50% total).\nExpensive: +10% per level, 5 levels (+50% total), starting at 500 science units with 2x cost growth per level.\nOther presets start at 100 science units with 1.5x cost growth. All presets take 30 seconds per unit. Gradual extends this cost growth through level 10.\nCustom: use the individual "Custom" settings below. All "Custom" settings are ignored for the other presets.\nFor an existing save, run /range-tech disable and save before changing startup settings.
rangetech-overrides=Move turrets to another category. Format: turret-name=category, separated by commas or semicolons. Example: gun-turret=laser; some-modded-turret=ignored\nCategories: bullet, shotgun, cannon, railgun, grenade, missile, flame, laser, electric, cold, acid, support, other, ignored. A turret is in exactly one category. "ignored" turrets get no research. Artillery turrets are always ignored.\nSee which turrets are in which category (and why) with the /rangetech command in game, or in the log file (lines starting with [range-tech]).
rangetech-icon-source=Auto: the research of a turret reuses the icon of the technology that unlocks it (checked for obvious problems, with a vanilla icon as fallback). Built-in: only vanilla icons. A bad icon file can only be detected by the game after all mods have loaded, so if your mod pack shows a sprite or icon error mentioning rangetech technologies, switch to Built-in.
rangetech-cost-base=Custom preset only. Amount of science packs for the first level of each category.
rangetech-cost-growth=Custom preset only. Each level costs this many times the previous one (1 = same cost every level).
rangetech-research-time=Custom preset only. Seconds per research unit.
rangetech-bullet-levels=Custom preset only. Number of range researches for Bullet turrets (gun turrets and similar). 0 disables the category.
rangetech-bullet-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-bullet-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-shotgun-levels=Custom preset only. Number of range researches for Shotgun turrets. 0 disables the category.
rangetech-shotgun-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-shotgun-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-cannon-levels=Custom preset only. Number of range researches for Cannon turrets. 0 disables the category.
rangetech-cannon-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-cannon-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-railgun-levels=Custom preset only. Number of range researches for Railgun turrets. 0 disables the category.
rangetech-railgun-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-railgun-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-grenade-levels=Custom preset only. Number of range researches for Grenade turrets. 0 disables the category.
rangetech-grenade-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-grenade-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-missile-levels=Custom preset only. Number of range researches for Missile turrets (rocket turrets and similar). 0 disables the category.
rangetech-missile-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-missile-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-flame-levels=Custom preset only. Number of range researches for Flame turrets. 0 disables the category.
rangetech-flame-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-flame-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-laser-levels=Custom preset only. Number of range researches for Laser turrets. 0 disables the category.
rangetech-laser-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-laser-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-electric-levels=Custom preset only. Number of range researches for Electric turrets (tesla and similar). 0 disables the category.
rangetech-electric-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-electric-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-cold-levels=Custom preset only. Number of range researches for Cold turrets (modded turrets with cold/frost damage or ammo). 0 disables the category.
rangetech-cold-mode=Custom preset only. Percent: bonus is a percentage of the turret's base range. Flat: bonus is in tiles.
rangetech-cold-amount=Custom preset only. Percent (e.g. 10 = +10% of base range) or tiles per level, depending on the bonus type. Levels add up.
rangetech-acid-levels=Custom preset only. Number of range researches for Acid turrets (modded turrets with acid/poison damage or ammo). 0 disables the category.
