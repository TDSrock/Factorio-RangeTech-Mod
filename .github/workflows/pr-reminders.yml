name: PR Reminders

# Non-blocking: posts (and keeps updating) ONE comment on the PR listing
# optional mod files that are still missing, with links to the relevant docs.
# This workflow never fails the build because of what it finds.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build reminder
        id: check
        run: |
          chmod +x scripts/check_optional_files.sh
          scripts/check_optional_files.sh reminder.md >> "$GITHUB_OUTPUT"
          # Always visible in the run summary, even if commenting is not allowed.
          cat reminder.md >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error: PRs from forks get a read-only token and cannot
      # comment. That must never turn the check red.
      - name: Create or update PR comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MISSING: ${{ steps.check.outputs.missing_count }}
        run: |
          MARKER="<!-- optional-files-reminder -->"
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1)

          if [[ -n "$COMMENT_ID" ]]; then
            # Keep the existing comment current (also flips items to done).
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -F body=@reminder.md > /dev/null
            echo "Updated reminder comment ${COMMENT_ID}"
          elif [[ "${MISSING}" != "0" ]]; then
            gh pr comment "$PR" --repo "$REPO" --body-file reminder.md
            echo "Posted reminder comment"
          else
            echo "Nothing missing and no existing comment; staying quiet."
          fi
